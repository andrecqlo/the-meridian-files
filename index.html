<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Meridian Files — a 15-minute investigation game for teams</title>
<meta name="description" content="A short investigation game for teams, played on one shared screen. A senior analyst has resigned overnight, leaving a locked file and fifteen minutes before a board meeting. Free, browser-based, nothing to install.">
<link rel="canonical" href="https://andrecqlo.github.io/the-meridian-files/">
<meta name="robots" content="index, follow">

<meta property="og:type" content="website">
<meta property="og:site_name" content="The Meridian Files">
<meta property="og:title" content="The Meridian Files — a 15-minute investigation game for teams">
<meta property="og:description" content="A short investigation game for teams, played on one shared screen. Fifteen minutes, one screen, a team around it.">
<meta property="og:url" content="https://andrecqlo.github.io/the-meridian-files/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="The Meridian Files — a 15-minute investigation game for teams">
<meta name="twitter:description" content="A short investigation game for teams, played on one shared screen.">

<meta name="colour-scheme" content="dark">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Game",
  "name": "The Meridian Files",
  "description": "A short investigation game for teams, played on one shared screen. A senior analyst has resigned overnight, leaving a locked file and fifteen minutes before a board meeting.",
  "genre": ["Team building game", "Investigation game", "Puzzle game"],
  "numberOfPlayers": {
    "@type": "QuantitativeValue",
    "minValue": 2
  },
  "url": "https://andrecqlo.github.io/the-meridian-files/",
  "applicationCategory": "Game",
  "operatingSystem": "Any (web browser)",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "GBP"
  }
}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="chrome" id="chrome" hidden>
  <div class="chrome__left">
    <button class="btn btn--quiet" type="button" id="btn-back" hidden>
      <span aria-hidden="true">←</span> <span id="btn-back-label">Desk</span>
    </button>
    <p class="chrome__case" id="chrome-case">Case 01</p>
  </div>

  <div class="chrome__timer" id="timer" data-level="calm">
    <span class="chrome__timer-value" id="timer-value">15:00</span>
    <span class="chrome__timer-note" id="timer-note">to sign-off</span>
  </div>

  <div class="chrome__right">
    <button class="btn btn--quiet" type="button" id="btn-sound" aria-pressed="false">Sound off</button>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<div class="hintstack" id="hintstack" hidden></div>
<div class="inventory" id="inventory" hidden></div>
<div class="torch-beam" id="torch-beam" hidden aria-hidden="true"></div>
<p class="visually-hidden" id="live-region" role="status" aria-live="polite"></p>
<div class="toast-rail" id="toast-rail" aria-hidden="true"></div>

<noscript>
  <p class="noscript">This is an interactive game and needs JavaScript switched on.</p>
</noscript>

<script type="module" src="engine/app.js"></script>
</body>
</html>
